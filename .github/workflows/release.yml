name: release

# Changesets release flow, the only way kenning publishes (there is no local
# release script):
#   1. Land commits that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens or updates a "Version Packages" PR that bumps the
#      versions and writes the changelogs from the pending changesets.
#   3. Merging that PR (which removes the changesets) makes this workflow run
#      `changeset publish`, which publishes the changed packages to npm.
#
# Auth is npm Trusted Publishing (OIDC): there is NO NPM_TOKEN secret. npm trusts
# this repository and this file (release.yml) through the trusted publisher
# registered on each package (kenning, kenning-pi). The handshake needs
# `id-token: write` and Node >= 22 (an npm with OIDC support).
on:
  push:
    branches: [main]
  # Manual trigger, to re-run the Version PR or publish step after a merge that
  # emitted no push event (a GITHUB_TOKEN API merge does not trigger `on: push`).
  workflow_dispatch: {}

# Serialize release runs on main, but never cancel one in progress: cancelling
# a run mid-publish would drop the release. `changeset publish` skips versions
# already on npm, so letting every queued run finish is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # No Actions cache in this job: the cache is shared per branch, and a
          # job holding id-token: write must not restore bytes another job could
          # have written. setup-node v5 caches by itself from `packageManager`,
          # so it is turned off explicitly. The price is one uncached install.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # release:ci format-checks, builds and tests, then runs
          # `changeset publish`; the action makes the git commits and tags.
          publish: pnpm release:ci
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
